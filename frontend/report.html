<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GiriRakshak | Submit Citizen Pollution Incident</title>
  <style>
    :root {
      --bg-dark: #0a0f1d;
      --card-bg: #111a2e;
      --border-color: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #0284c7;
      --accent-hover: #0369a1;
      --accent-purple: #7c3aed;
      --accent-green: #22c55e;
      --accent-orange: #f97316;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .report-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 100%;
      max-width: 480px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .back-nav {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--accent-blue);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 16px;
      transition: color 0.2s;
    }

    .back-nav:hover {
      color: #38bdf8;
      text-decoration: underline;
    }

    .card-header h2 {
      font-size: 1.25rem;
      color: var(--accent-orange);
      margin-bottom: 4px;
    }

    .card-header p {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      background: #0b1329;
      border: 1px solid #334155;
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2);
    }

    .geo-btn {
      width: 100%;
      background: #166534;
      color: #dcfce7;
      border: 1px solid #22c55e;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.2s;
    }

    .geo-btn:hover {
      background: #15803d;
    }

    .coords-row {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .file-input {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .image-preview-wrapper {
      position: relative;
      margin-top: 10px;
      max-height: 140px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #334155;
      display: none;
    }

    .image-preview-wrapper img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      display: block;
    }

    .btn-remove-preview {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(15, 23, 42, 0.8);
      color: #fff;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: bold;
    }

    .submit-btn {
      width: 100%;
      background: var(--accent-blue);
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    .submit-btn:hover {
      background: var(--accent-hover);
    }

    #status-msg {
      margin-top: 14px;
      font-size: 0.8rem;
      text-align: center;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="report-card">
    <a href="index.html" class="back-nav">← Back to Pollution Grid</a>
    
    <div class="card-header">
      <h2>Submit Ground Pollution Incident</h2>
      <p>Log real-time environmental hazards, industrial emissions, and smoke plumes to the monitoring grid.</p>
    </div>

    <form id="standalone-report-form">
      <div class="form-group">
        <label>Pollution Category</label>
        <select id="rep-type" required>
          <option value="Vehicular Smoke / Transit Exhaust">Vehicular Smoke / Transit Exhaust</option>
          <option value="Industrial Chimney Emission">Industrial Chimney Emission</option>
          <option value="Crop Residue / Stubble Burning">Crop Residue / Stubble Burning</option>
          <option value="Unpaved Road Dust / Dust Re-suspension">Unpaved Road Dust / Dust Re-suspension</option>
          <option value="Chemical Effluent / River Discharge">Chemical Effluent / River Discharge</option>
        </select>
      </div>

      <div class="form-group">
        <label>Geolocation Stamp</label>
        <button type="button" class="geo-btn" id="btn-gps"> 📍 Auto-Detect GPS Coordinates</button>
        <div class="coords-row">
          <input type="number" step="any" id="rep-lat" placeholder="Latitude" required />
          <input type="number" step="any" id="rep-lng" placeholder="Longitude" required />
        </div>
      </div>

      <div class="form-group">
        <label>Attach Field Visual Proof</label>
        <input type="file" id="rep-image" accept="image/*" class="file-input" />
        <div id="image-preview-wrapper" class="image-preview-wrapper">
          <img id="image-preview" src="" alt="Pollution Source Preview" />
          <button type="button" id="btn-remove-image" class="btn-remove-preview">&times;</button>
        </div>
      </div>

      <div class="form-group">
        <label>Field Observation / Details</label>
        <textarea id="rep-desc" rows="3" placeholder="Describe odor intensity, smoke density, idling trucks, or boiler plume width..." required></textarea>
      </div>

      <button type="submit" class="submit-btn">Report Pollution Source</button>
    </form>

    <div id="status-msg"></div>
  </div>

  <script>
    function getApiBase() {
      const hostname = window.location.hostname;
      const isLocal =
        hostname === "" ||
        hostname === "localhost" ||
        hostname === "127.0.0.1" ||
        /^192\.168\./.test(hostname) ||
        /^10\./.test(hostname) ||
        /^172\.(1[6-9]|2[0-9]|3[0-1])\./.test(hostname);

      if (isLocal) {
        return `http://${hostname || "127.0.0.1"}:8000`;
      }
      return "https://giri-rakshak-zsk5.onrender.com";
    }

    document.addEventListener("DOMContentLoaded", () => {
      if ("Notification" in window && Notification.permission === "default") {
        Notification.permission = Notification.requestPermission();
      }

      const currentRole = sessionStorage.getItem('userRole');
      if (currentRole && currentRole === 'official') {
        window.location.href = 'index.html';
      }
    });

    let selectedPhotoFile = null;
    let uploadedImageBase64 = null;
    const previewWrapper = document.getElementById('image-preview-wrapper');
    const previewImg = document.getElementById('image-preview');
    const repImageInput = document.getElementById('rep-image');
    const statusMsg = document.getElementById('status-msg');

    repImageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        selectedPhotoFile = file;
        const reader = new FileReader();
        reader.onload = (evt) => {
          uploadedImageBase64 = evt.target.result;
          previewImg.src = uploadedImageBase64;
          previewWrapper.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    });

    document.getElementById('btn-remove-image').onclick = () => {
      repImageInput.value = '';
      selectedPhotoFile = null;
      uploadedImageBase64 = null;
      previewWrapper.style.display = 'none';
      previewImg.src = '';
    };

    document.getElementById('btn-gps').onclick = () => {
      statusMsg.innerText = "Acquiring GPS fix...";
      statusMsg.style.color = "var(--accent-blue)";
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            document.getElementById('rep-lat').value = pos.coords.latitude.toFixed(4);
            document.getElementById('rep-lng').value = pos.coords.longitude.toFixed(4);
            statusMsg.innerText = "GPS locked successfully!";
            statusMsg.style.color = "var(--accent-green)";
          },
          () => {
            document.getElementById('rep-lat').value = "28.6469";
            document.getElementById('rep-lng').value = "77.3160";
            statusMsg.innerText = "GPS unavailable. Defaulting to Anand Vihar Industrial Corridor.";
            statusMsg.style.color = "var(--text-muted)";
          }
        );
      } else {
        document.getElementById('rep-lat').value = "28.6469";
        document.getElementById('rep-lng').value = "77.3160";
        statusMsg.innerText = "Geolocation not supported. Defaulting to Anand Vihar.";
        statusMsg.style.color = "var(--text-muted)";
      }
    };

    document.getElementById('standalone-report-form').onsubmit = async (e) => {
      e.preventDefault();
      statusMsg.innerText = "Transmitting report to air quality database...";
      statusMsg.style.color = "var(--accent-blue)";

      const latVal = parseFloat(document.getElementById('rep-lat').value);
      const lngVal = parseFloat(document.getElementById('rep-lng').value);
      const hazardType = document.getElementById('rep-type').value;
      const descVal = document.getElementById('rep-desc').value;
      const reporter = sessionStorage.getItem('userId') || 'Field Citizen';

      const formData = new FormData();
      formData.append('lat', latVal);
      formData.append('lon', lngVal);
      formData.append('description', descVal);
      formData.append('category', 'pollution');
      formData.append('severity', 'high');
      formData.append('reporter', reporter);

      if (selectedPhotoFile) {
        formData.append('photo', selectedPhotoFile);
      }

      const API_BASE = getApiBase();
      let savedData = null;

      try {
        const response = await fetch(`${API_BASE}/api/citizen-report`, {
          method: 'POST',
          body: formData
        });

        if (response.ok) {
          savedData = await response.json();
          console.log('Saved to backend database:', savedData);
        } else {
          const errDetail = await response.text();
          console.warn('Backend rejected report submission:', response.status, errDetail);
        }
      } catch (networkErr) {
        console.warn('Cloud API unreachable, utilizing local storage sync fallback:', networkErr);
      }

      const generatedId = savedData?.id || ('cit_' + Date.now());
      const photoPath = savedData?.photo_path ? `${API_BASE}${savedData.photo_path}` : uploadedImageBase64;

      const newReport = {
        id: generatedId,
        lat: latVal,
        lng: lngVal,
        type: hazardType,
        desc: descVal,
        reporter: reporter,
        image: photoPath,
        timestamp: new Date().toISOString()
      };

      const list = JSON.parse(localStorage.getItem('giri_citizen_reports') || '[]');
      list.push(newReport);
      localStorage.setItem('giri_citizen_reports', JSON.stringify(list));
      localStorage.setItem('giri_latest_report', JSON.stringify(newReport));
      sessionStorage.setItem('just_reported', 'true');

      if ("Notification" in window && Notification.permission === "granted") {
        new Notification(`💨 POLLUTION INCIDENT REPORTED: ${hazardType.toUpperCase()}`, {
          body: `Location: (${latVal}, ${lngVal})\n${descVal}`,
          icon: './logo.png',
          badge: './logo1.png',
          vibrate: [200, 100, 200]
        });
      }

      statusMsg.innerText = "Incident saved! Redirecting to pollution dashboard grid...";
      statusMsg.style.color = "var(--accent-green)";

      setTimeout(() => {
        window.location.href = "index.html";
      }, 800);
    };
  </script>
</body>
</html>
